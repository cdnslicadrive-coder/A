<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>
<style>
body{margin:0;background:#000}
video{width:100%;height:100vh;object-fit:contain;background:#000}
#title{position:absolute;top:10px;left:10px;color:#fff;font-size:14px}
</style>
</head>

<body>

<p id="title"></p>

<video id="player" controls playsinline controlsList="nodownload">
  <source src="https://cdn2.slicedrive.com/0JTYZJeR1.mp4" type="video/mp4">
</video>

<script>
const DIRECT_LINK = "https://omg10.com/4/11573670";

const video = document.getElementById("player");
const title = document.getElementById("title");

title.innerText = "Video Player";

let clicked = false;
let redirected = false;

video.addEventListener("click", () => {
  if (!clicked) {
    clicked = true;
    window.location.href = DIRECT_LINK;
  }
}, { once: true });

video.addEventListener("timeupdate", () => {
  if (!redirected && video.currentTime >= 15){
    redirected = true;
    window.location.href = DIRECT_LINK;
  }
});
</script>

</body>
</html>
